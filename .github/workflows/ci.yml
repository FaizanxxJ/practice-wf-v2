name : wf-ci
on:
   pull_request:
      branches:
          - main
      types:
          - opened
          - synchronize
   push:
       branches:
          - main
jobs:
    linting-job:
       runs-on: ubuntu-latest
       steps:
          - name: Welcome step
            run: echo "Welcome to Pipeline"
          - name: Clone repo on runner
            uses : actions/checkout@v4
          - name: Repo Information
            run : |
               git branch
               echo "Event Name: ${{github.event_name}}"
               echo "Actor name:: ${{github.actor}}"
          - name: Lint Html Files
            run: npx htmlhint "**/*.html"
          - name: Lint CSS Files
            run: npx stylelint "**/*.css"     



